   name: Koi

   on:
     schedule:
       - cron: "17 1 * * *"
     workflow_dispatch:
     push:
       paths: [.github/workflows/koi.yml]

   permissions:
     contents: write

   concurrency: koi

   jobs:
     koi:
       runs-on: ubuntu-latest
       timeout-minutes: 20
       steps:
         - name: Check out the profile repo
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - name: Check out the pinned git-koi fork
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
             repository: jeyanthm06-create/git-koi
             ref: 81a719e99e8c34eb26dd72bb8067b547b5a55420
             path: koi-src
             persist-credentials: false

         - name: Build git-koi from the fork
           run: |
             rustup update stable
             rustc --version
             cargo build --release --locked --manifest-path koi-src/Cargo.toml

         - name: Collect the account snapshot
           env:
             GH_TOKEN: ${{ github.token }}
             KOI_LOGIN: ${{ github.repository_owner }}
           run: |
             ./koi-src/target/release/git-koi collect "$KOI_LOGIN" --output "$RUNNER_TEMP/koi-snapshot.json"

         - name: Render the koi
           run: |
             ./koi-src/target/release/git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir koi --body white

         - name: Commit the koi if it changed
           shell: bash
           run: |
             git add koi/koi.gif
             if git diff --cached --quiet; then
               echo "Unchanged."
               exit 0
             fi
             git config user.name "github-actions[bot]"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             git commit --quiet --message "koi: update"
             git push --quiet
