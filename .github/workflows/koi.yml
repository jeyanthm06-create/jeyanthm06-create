   name: Koi

   on:
     schedule:
       - cron: "17 1 * * *"
     workflow_dispatch:
     push:
       paths: [.github/workflows/koi.yml]

   permissions:
     contents: write

   concurrency: koi

   jobs:
     koi:
       runs-on: ubuntu-latest
       timeout-minutes: 10
       steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
           with:
             body: white
             output-dir: koi
         - name: Commit the koi if it changed
           shell: bash
           run: |
             git add koi/koi.gif
             if git diff --cached --quiet; then
               echo "Unchanged."
               exit 0
             fi
             git config user.name "github-actions[bot]"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             git commit --quiet --message "koi: update"
             git push --quiet
